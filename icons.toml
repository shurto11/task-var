# task-var のアイコン列(と再生情報パネル・Melon 枠)の定義。
#
# 保存すると 1 秒以内にバーへ反映される(task-var の再起動もビルドも要らない)。
# 書き間違いがあれば反映せず、前の定義のまま動き続ける。理由はログ
# (/tmp/tmux-autostart/task-var.log)に出る。
#
# [[icon]] を 1 つ書くごとに、アイコン列へ左から順に並ぶ。並べ替えはブロックごと
# 入れ替えるだけ。消せば列から消える。
#
#   name    … tmux のセッション名。タップするとこのセッションへ切り替わる。
#             ほかのアイコンと重ねない。「:」と「.」は使えない
#   image   … アイコンの画像(SVG / PNG / JPEG)。白い円の上に乗る。
#             相対パスはこのファイルの場所から。~/ も使える
#   command … セッションがまだ無いとき、新しく作ったセッションで実行するコマンド。
#             シェル経由で実行するので ~ や && がそのまま使える。
#             コマンドが終わるとセッションも消える
#   window  … (省略可)true にすると、セッションを作らず、いま表示している
#             セッションに毎回新しいウィンドウを開いて command を実行する。
#             下線は「ほかのアイコンのセッション以外を見ている間」が水色になる
#   hint_session … (省略可)キーボード(Ctrl+b f)で選んだときだけ command を実行せず、
#             このセッションへ移る。tmux は最後に開いていたウィンドウを覚えているので
#             そこへ戻る。もうそのセッションに居るなら直前のウィンドウへ(Ctrl+b l と同じ)。
#             セッションが無ければタップと同じ動作になる
#
# ブランドのアイコンは Simple Icons(https://simpleicons.org)の slug を使って
#   curl -fsSL https://cdn.simpleicons.org/<slug> -o assets/<名前>.svg
# で取れる。ブランドカラー付きの SVG が落ちてくるので、そのまま色付きで描ける。

# タップなら tmux-session(スイッチャー)、Ctrl+b f a ならセッション 0 の最近のウィンドウへ
[[icon]]
name = "tmux"
image = "assets/tmux.svg"
command = "~/ssd/fb/tmux-session/target/release/tmux-session"
window = true
hint_session = "0"

[[icon]]
name = "bluetooth"
image = "assets/bluetooth.svg"
command = "bluetoothctl"

[[icon]]
name = "camera"
image = "assets/camera.svg"
command = "~/ssd/apps/fbcam/target/release/fbcam"

[[icon]]
name = "fbrowse"
image = "assets/fbrowse.svg"
command = "~/ssd/fb/fbrowse/target/release/fbrowse --auto"

[[icon]]
name = "fbservo"
image = "assets/fbservo.svg"
command = "~/ssd/fb/fbservo/target/release/fbservo"

# eduroam は ~/.bashrc の関数(sudo wpa_supplicant ...)なので、対話 bash 経由で呼ぶ
[[icon]]
name = "eduroam"
image = "assets/eduroam.svg"
command = "bash -ic eduroam"

[[icon]]
name = "wanna"
image = "assets/wanna.svg"
command = "~/ssd/tui/wanna/target/release/wanna"

# calendar-tui は credentials.json をカレントディレクトリから探すので、
# 自分のディレクトリへ cd してから起動する
[[icon]]
name = "calendar"
image = "assets/calendar.svg"
command = "cd ~/ssd/tui/calendar-tui && ./target/release/calendar-tui"

# drmterm は中で `tmux new -A -s ext` を起動する。TMUX を引き継ぐと
# 「sessions should be nested with care」で拒否されるので外して起動する
[[icon]]
name = "drmterm"
image = "assets/drmterm.svg"
command = "env -u TMUX ~/ssd/drmterm/target/release/drmterm"

# 再生情報パネル(右端)。アイコン列には並ばず、パネルのボタン以外をタップすると
# このセッションへ切り替わる。image はアルバムアートが取れていない間に出る。
[spotify]
name = "spotify"
image = "assets/spotify.svg"
command = "~/ssd/tui/spotatui/target/release/spotatui"

# Melon 枠(clawd 枠とアイコン列の間)。追っている曲の Melon TOP100 順位を出す。
# この節を丸ごとコメントアウトすると Melon 枠が消え、空いたぶんは clawd 枠が使う
# (順位の取得も止まる)。戻せばまた出る。
#
#   image … 札に置くロゴ。商標なのでリポジトリには含めず、
#           scripts/fetch-melon-logo.sh で落とす(読めなければ札は白地だけ)
#   songs … 追う曲の Melon の songId(melon.com の曲ページの URL にある
#           songId=… の数字)。書いた順に左から並ぶ
# [melon]
# image = "assets/melon.png"
# songs = [
#   "603442244", # NMIXX「긴 소원 (Birthday Wish)」
#   "601879407", # NMIXX「Heavy Serenade」
#   "600243411", # NMIXX「Blue Valentine」
# ]
