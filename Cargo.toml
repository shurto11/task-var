[package]
name = "task-var"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.45", default-features = false }
signal-hook = "0.3"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.release]
opt-level = 2
